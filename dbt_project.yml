name: industrial_group_edw
version: "1.0.0"
config-version: 2

profile: industrial_group_edw

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Layer conventions.
#   staging       one model per source table. Rename, trim, cast, convert units.
#                 Views, because they are thin and cheap to rebuild.
#   intermediate  the common-schema layer. Unions every subsidiary into one shape.
#                 This is what makes onboarding a new company a change to ONE layer.
#   marts         the dimensional model. Tables, because they are read repeatedly.
models:
  industrial_group_edw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # The reporting timezone the group standardises on. Source systems that store UTC are
  # converted to this; systems that already store local time are left alone.
  reporting_timezone: "Europe/Oslo"

  # Any source timestamp on or before this is treated as "no date". ERPs commonly write
  # the epoch instead of NULL, and 1970-01-01 is not a real transaction date.
  epoch_cutoff: "1970-01-02"

  # Unknown-member key. Dimension lookups resolve to this rather than dropping the fact
  # row, so a missing dimension entry never silently loses a transaction.
  unknown_key: -1


